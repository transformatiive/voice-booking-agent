<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atende · Backoffice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="side">
        <div class="brand"><span class="dot">A</span> Atende</div>
        <nav id="nav">
          <a data-tab="overview" class="active">Visão geral</a>
          <a data-tab="assistant">Assistente</a>
          <a data-tab="resources">Recursos</a>
          <a data-tab="services">Serviços</a>
          <a data-tab="hours">Horários</a>
          <a data-tab="scheduling">Agenda / Cal.com</a>
          <a data-tab="billing">Faturação</a>
          <a data-tab="bookings">Marcações</a>
        </nav>
        <div style="margin-top:24px">
          <a class="btn btn-ghost btn-sm" id="demoLink" href="#">Testar assistente →</a>
        </div>
      </aside>

      <main class="main">
        <div id="flash"></div>
        <h1 id="bizName">…</h1>
        <p class="muted" id="bizMeta"></p>

        <div id="tab-overview" class="tab"></div>
        <div id="tab-assistant" class="tab hidden"></div>
        <div id="tab-resources" class="tab hidden"></div>
        <div id="tab-services" class="tab hidden"></div>
        <div id="tab-hours" class="tab hidden"></div>
        <div id="tab-scheduling" class="tab hidden"></div>
        <div id="tab-billing" class="tab hidden"></div>
        <div id="tab-bookings" class="tab hidden"></div>
      </main>
    </div>
    <script src="/admin.js"></script>
