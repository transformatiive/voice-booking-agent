<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atende · Demo do assistente</title>
    <link rel="stylesheet" href="/landing.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="demo-shell">
      <aside class="demo-side">
        <a class="logo" href="/" style="margin-bottom:18px"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4"/><path d="M8 6.5v11"/><path d="M12 3v18"/><path d="M16 6.5v11"/><path d="M20 10v4"/></svg></span> Atende</a>
        <div class="panel">
          <h2 id="bizName">…</h2>
          <p class="panel-hint" id="bizMeta" style="margin:4px 0 0"></p>
          <a class="btn btn-ghost btn-sm" id="adminLink" href="#" style="margin-top:12px">Abrir backoffice</a>
        </div>
        <div class="panel">
          <h2>Marcações</h2>
          <ul id="bookings" class="bookings-list"><li class="when">Sem marcações.</li></ul>
        </div>
        <div class="panel">
          <h2>Experimente dizer</h2>
          <ul class="bookings-list" id="hints"></ul>
        </div>
      </aside>

      <main class="chat">
        <div class="chat-head">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">A ligar…</span>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer">
          <button type="button" id="mic" class="btn btn-ghost mic" title="Falar">🎙️</button>
          <input id="input" type="text" autocomplete="off" placeholder="Escreva ou toque no microfone…" />
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </main>
    </div>
    <script src="/demo.js"></script>
  </body>
</html>
